# 出典の台帳の見本です。works/<slug>/sources.yml にコピーして書き換えます。
# 値はすべて架空です。
#
# permission に書ける値:
#   未依頼: 文章や画像の掲載をまだ頼んでいない
#   依頼中: 掲載を頼み、返事を待っている
#   許諾:   掲載の許諾を得た
#   拒否:   掲載を断られた、または削除の申し出を受けて外した
#   不要:   書いた本人の言葉など、許諾を得る必要がない
sources:
  - id: src-001
    url: https://example.com/official
    kind: 公式サイト
    rights_holder: 架空の権利者
    terms_url: https://example.com/official/terms
    permission: 未依頼
    checked_at: 2000-01-01
  - id: src-002
    url: https://example.com/guidebook
    kind: 設定資料
    rights_holder: 架空の出版社
    terms_url: https://example.com/guidebook/terms
    permission: 許諾
    checked_at: 2000-01-01
  - id: src-003
    url: https://example.com/writer
    kind: 感想
    rights_holder: 見本の筆者
    terms_url: https://example.com/writer/terms
    permission: 不要
    checked_at: 2000-01-01
