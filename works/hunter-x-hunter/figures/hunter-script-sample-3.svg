<text x="408.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ん</text>
<g transform="translate(440.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="30"/><line x1="50" y1="4" x2="50" y2="96"/><circle cx="114" cy="98" r="8" fill="currentColor" stroke="none"/></g>
<text x="460.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ど</text>
<text x="24" y="224" font-size="12" font-weight="600" text-anchor="start" fill="#46515c">字形は筆者が解読表をもとに描き起こしたもので、公式の画像ではない</text>
</svg>
