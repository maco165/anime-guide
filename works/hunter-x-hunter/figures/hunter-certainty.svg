<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 466" width="640" height="466" role="img" aria-labelledby="hunter-certainty-title hunter-certainty-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="hunter-certainty-title">「ハンターと協会」の確かさの印の数</title>
<desc id="hunter-certainty-desc">公式 0 件、複数サイトで一致 6 件、1 サイトのみ 17 件、説が割れている 2 件の横棒グラフ。</desc>
<defs><pattern id="hunter-certainty-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="466" fill="#f1f5f8"/>
<rect width="640" height="466" fill="url(#hunter-certainty-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">確かさの印: 多いのは 1 サイトのみ</text>
<line x1="24.0" y1="84" x2="24.0" y2="348" stroke="#10131a" stroke-width="2" stroke-linecap="round"/>
<text x="24" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">0</text>
<line x1="159.0" y1="84" x2="159.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="159" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">5</text>
<line x1="294.0" y1="84" x2="294.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="294" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">10</text>
<line x1="429.0" y1="84" x2="429.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="429" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">15</text>
<line x1="564.0" y1="84" x2="564.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="564" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">20</text>
<text x="616" y="368" font-size="17" font-weight="500" text-anchor="end" fill="#46515c">件</text>
<text x="32" y="102" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">公式</text>
<text x="34" y="129" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">0</text>
<text x="32" y="166" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">複数サイトで一致</text>
<g data-mark="multi" data-count="6"><path d="M24 174 h158 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-158 z" fill="#1f62d6"/></g>
<text x="196" y="193" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">6</text>
<text x="32" y="230" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<g data-mark="single" data-count="17"><path d="M24 238 h455 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-455 z" fill="#d92d20"/></g>
<text x="493" y="257" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">17</text>
<text x="32" y="294" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">説が割れている</text>
<g data-mark="split" data-count="2"><path d="M24 302 h50 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-50 z" fill="#1f62d6"/></g>
<text x="88" y="321" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">2</text>
<text x="24" y="396" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">印 1 つを 1 件と数えて計 25 件</text>
</svg>
