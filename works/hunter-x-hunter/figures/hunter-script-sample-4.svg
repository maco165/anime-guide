<text x="200.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ょ</text>
<g transform="translate(232.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="10" x2="84" y2="10"/><line x1="10" y1="90" x2="90" y2="90"/><circle cx="50" cy="50" r="20" fill="currentColor" stroke="none"/></g>
