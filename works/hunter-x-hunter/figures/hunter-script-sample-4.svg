<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 664 230" width="664" height="230" role="img" aria-labelledby="hunter-script-sample-4-title hunter-script-sample-4-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="hunter-script-sample-4-title">ハンター文字の例文「一緒に冒険しよう」</title>
<desc id="hunter-script-sample-4-desc">「一緒に冒険しよう」(いっしょにぼうけんしよう) をハンター文字で書いた例。小さい っ と ょ、濁点の ぼ を含む。字の下に対応するひらがなを添える。</desc>
<defs><pattern id="hunter-script-sample-4-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="664" height="230" fill="#f1f5f8"/>
<rect width="664" height="230" fill="url(#hunter-script-sample-4-grid)"/>
<rect x="0" y="0" width="664" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">例文: 一緒に冒険しよう</text>
<text x="24" y="92" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">一緒に冒険しよう  (いっしょにぼうけんしよう)</text>
<text x="24" y="118" font-size="14" font-weight="700" text-anchor="start" fill="#46515c">小さい っ と ょ、濁点の ぼ を含む</text>
