<text x="96.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">っ</text>
<g transform="translate(128.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="12" x2="90" y2="12"/><line x1="10" y1="34" x2="90" y2="34"/><circle cx="50" cy="68" r="18" fill="currentColor" stroke="none"/></g>
