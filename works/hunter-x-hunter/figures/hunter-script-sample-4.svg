<text x="564.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">よ</text>
<g transform="translate(596.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M22,92 V40 A28,28 0 0 1 78,40 V92"/></g>
<text x="616.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">う</text>
<text x="24" y="224" font-size="12" font-weight="600" text-anchor="start" fill="#46515c">字形は筆者が解読表をもとに描き起こしたもので、公式の画像ではない</text>
