<title id="gungi-opening-5-title">軍儀の序盤の例 5</title>
<desc id="gungi-opening-5-desc">後手が手元の大を、新で自分の中の上に打って 2 段にした盤面の例。新で重ねて打てるのは、いちばん上が自分の駒のところだけ。2 段の山を取れるのは 2 段以上の駒だけ。</desc>
