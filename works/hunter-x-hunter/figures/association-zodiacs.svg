<title id="association-zodiacs-title">ハンター協会と十二支ん</title>
<desc id="association-zodiacs-desc">会長の下に、干支をコードネームにした最高幹部 12 人の十二支んを置き、干支、名前、肩書きのハンターの種類を 12 枚の札で並べた図。2011 年版に出てくるときの顔ぶれ。</desc>
