<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="greed-island-title greed-island-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif" data-sources="src-029 src-030 src-031 src-032 src-033">
<title id="greed-island-title">グリードアイランドのカード</title>
<desc id="greed-island-desc">ジンと仲間が念で作った念能力者専用のゲームで、念を込めて起動する。指定ポケットカードは No.000 から No.099 の 100 種で、001 から 099 をそろえると出題されるクイズの優勝者に No.000 の支配者の祝福が与えられ、クリアすると指定ポケットカードを 3 枚まで現実に持ち帰れることを示す。</desc>
<defs><pattern id="greed-island-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
