<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="hunter-script-sample-2-title hunter-script-sample-2-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="hunter-script-sample-2-title">ハンター文字の例文「念の修行」</title>
<desc id="hunter-script-sample-2-desc">「念の修行」(ねんのしゅぎょう) をハンター文字で書いた例。小さい ゅ と ょ、濁点の ぎ を含む。字の下に対応するひらがなを添える。</desc>
<defs><pattern id="hunter-script-sample-2-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="230" fill="#f1f5f8"/>
<rect width="640" height="230" fill="url(#hunter-script-sample-2-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">例文: 念の修行</text>
<text x="24" y="92" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">念の修行  (ねんのしゅぎょう)</text>
<text x="24" y="118" font-size="14" font-weight="700" text-anchor="start" fill="#46515c">小さい ゅ と ょ、濁点の ぎ を含む</text>
<g transform="translate(24.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="10" x2="16" y2="90"/><line x1="84" y1="10" x2="84" y2="90"/><line x1="16" y1="10" x2="84" y2="90"/><line x1="16" y1="90" x2="84" y2="10"/></g>
<text x="44.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ね</text>
<g transform="translate(76.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="30" r="23" fill="currentColor" stroke="none"/><line x1="14" y1="92" x2="86" y2="24"/></g>
<text x="96.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ん</text>
<g transform="translate(128.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="32" r="20"/><path d="M84,8 V62 A26,26 0 0 1 58,88 H18"/></g>
<text x="148.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">の</text>
<g transform="translate(180.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="12" x2="90" y2="12"/><line x1="10" y1="34" x2="90" y2="34"/><circle cx="50" cy="68" r="18" fill="currentColor" stroke="none"/></g>
<text x="200.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">し</text>
<g transform="translate(242.0,152.0) scale(0.200)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><polyline points="12,10 50,10 50,40"/><path d="M16,92 V66 A34,28 0 0 1 84,66 V92"/></g>
<text x="252.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ゅ</text>
<g transform="translate(284.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="8" x2="22" y2="92"/><circle cx="48" cy="54" r="22" fill="currentColor" stroke="none"/><circle cx="114" cy="98" r="8" fill="currentColor" stroke="none"/></g>
<text x="304.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ぎ</text>
<g transform="translate(346.0,152.0) scale(0.200)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="26" r="18"/><line x1="50" y1="44" x2="50" y2="92"/></g>
<text x="356.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">ょ</text>
<g transform="translate(388.0,134.0) scale(0.400)" fill="none" stroke="#10131a" color="#10131a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M22,92 V40 A28,28 0 0 1 78,40 V92"/></g>
<text x="408.0" y="204" font-size="15" font-weight="800" text-anchor="middle" fill="#1f62d6">う</text>
<text x="24" y="224" font-size="12" font-weight="600" text-anchor="start" fill="#46515c">字形は筆者が解読表をもとに描き起こしたもので、公式の画像ではない</text>
</svg>
