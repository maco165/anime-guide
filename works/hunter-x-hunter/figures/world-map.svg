<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 860" width="640" height="860" role="img" aria-labelledby="world-map-title world-map-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="world-map-title">HUNTER×HUNTER の世界の模式図</title>
<desc id="world-map-desc">人の住む世界が暗黒大陸の中のメビウス湖の中心にあり、その中にヨルビアン大陸 (西の端にヨークシンシティ、その真東の海にグリードアイランド)、アイジエン大陸 (中央にカキン帝国)、ミテネ連邦と東ゴルトー共和国があることを示す自作の模式図。各編の舞台を吹き出しで示す。大陸の形と互いの位置は筆者が決めたもので、公式の地図ではない。所在が確かめられない舞台は下の枠に並べる。</desc>
<defs><pattern id="world-map-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
