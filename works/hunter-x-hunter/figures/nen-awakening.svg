<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="nen-awakening-title nen-awakening-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="nen-awakening-title">精孔の開き方は 2 通り</title>
<desc id="nen-awakening-desc">瞑想などで自然に精孔を開く道と、他人のオーラを送り込んで無理に開く道を左右に並べ、無理に開くと命に関わる危険があること、開いた直後はオーラを体に留めないと立てないほど疲れることを示す。</desc>
<defs><pattern id="nen-awakening-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="470" fill="#f1f5f8"/>
<rect width="640" height="470" fill="url(#nen-awakening-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">精孔の開き方は 2 通り</text>
<rect x="16" y="72" width="296" height="170" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="72" width="296" height="30" rx="0" fill="#0b8a5f" stroke="#10131a" stroke-width="3"/>
<text x="164.0" y="94" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">ゆっくり開く</text>
<text x="30" y="127" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">瞑想などでオーラを</text>
<text x="30" y="152" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">感じ取り、精孔が</text>
<text x="30" y="177" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">自然に開く</text>
<rect x="328" y="72" width="296" height="170" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="328" y="72" width="296" height="30" rx="0" fill="#d92d20" stroke="#10131a" stroke-width="3"/>
<text x="476.0" y="94" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">無理に開く</text>
<text x="342" y="127" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">他人がオーラを</text>
<text x="342" y="152" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">送り込んで</text>
<text x="342" y="177" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">こじ開ける</text>
<text x="476" y="228" font-size="17" font-weight="800" text-anchor="middle" fill="#d92d20">未熟な者がやると命の危険</text>
<path d="M164 248 L164.0 282.0" fill="none" stroke="#0b8a5f" stroke-width="6" stroke-linecap="round"/>
<polygon points="164,296 174.0,282.0 154.0,282.0" fill="#0b8a5f" stroke="#0b8a5f" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M476 248 L476.0 282.0" fill="none" stroke="#d92d20" stroke-width="6" stroke-linecap="round"/>
<polygon points="476,296 486.0,282.0 466.0,282.0" fill="#d92d20" stroke="#d92d20" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="16" y="304" width="608" height="104" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="304" width="608" height="30" rx="0" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="320.0" y="326" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">開いた直後</text>
<text x="30" y="359" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">生命エネルギーが勢いよく流れ出す。</text>
<text x="30" y="384" font-size="19" font-weight="700" text-anchor="start" fill="#10131a">オーラを体に留めるこつを得ないと立てないほど疲れる</text>
<text x="24" y="440" font-size="17" font-weight="600" text-anchor="start" fill="#46515c">無理に開く道は 2 サイトで一致。ほかは 1 サイトのみ</text>
</svg>
