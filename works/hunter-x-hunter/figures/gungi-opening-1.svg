<title id="gungi-opening-1-title">軍儀の序盤の例 1</title>
<desc id="gungi-opening-1-desc">先手と後手が自陣に帥、大、中を 1 枚ずつ並べ、残りの駒を手元に置いた盤面の例。陣地の広さは確かめられていないので、手前の 3 段に並べた。</desc>
