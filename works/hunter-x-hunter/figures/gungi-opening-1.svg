<text x="113.0" y="336.0" font-size="14" font-weight="800" text-anchor="middle" fill="#10131a">中</text>
<rect x="350" y="76" width="266" height="306" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="366" y="106" font-size="16" font-weight="800" text-anchor="start" fill="#d92d20">1 / 5</text>
<text x="366" y="138" font-size="16" font-weight="700" text-anchor="start" fill="#10131a">中級と上級では、自分の陣地の</text>
<text x="366" y="164" font-size="16" font-weight="700" text-anchor="start" fill="#10131a">中で駒を自由に並べる</text>
<text x="366" y="190" font-size="16" font-weight="700" text-anchor="start" fill="#10131a"></text>
<text x="366" y="216" font-size="16" font-weight="700" text-anchor="start" fill="#10131a">先手が「済み」と告げても、</text>
<text x="366" y="242" font-size="16" font-weight="700" text-anchor="start" fill="#10131a">後手は並べ続けられる</text>
<text x="366" y="268" font-size="16" font-weight="700" text-anchor="start" fill="#10131a"></text>
<text x="366" y="294" font-size="16" font-weight="700" text-anchor="start" fill="#10131a">並べなかった駒は手元に置き、</text>
<text x="366" y="320" font-size="16" font-weight="700" text-anchor="start" fill="#10131a">あとで新で打てる</text>
<text x="24" y="438" font-size="14" font-weight="600" text-anchor="start" fill="#46515c">筆者が作った例。駒の並びは公式の解説書のものではない</text>
