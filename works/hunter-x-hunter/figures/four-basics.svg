<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 500" width="640" height="500" role="img" aria-labelledby="four-basics-title four-basics-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="four-basics-title">四大行の 4 つの役割</title>
<desc id="four-basics-desc">纏、絶、練、発の 4 つを、オーラを留める、断つ、増やす、能力にするという役割と、主な効き目で並べた図。発は大きく 6 つの系統に分かれる。</desc>
<defs><pattern id="four-basics-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="500" fill="#f1f5f8"/>
<rect width="640" height="500" fill="url(#four-basics-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">四大行は 留める・断つ・増やす・能力にする</text>
<rect x="16" y="74" width="608" height="88" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="74" width="104" height="88" rx="0" fill="#1f62d6" stroke="#10131a" stroke-width="3"/>
<text x="68" y="128" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff">纏</text>
<text x="68" y="154" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">テン</text>
<text x="136" y="110" font-size="21" font-weight="800" text-anchor="start" fill="#10131a">オーラを体に留める</text>
<text x="136" y="142" font-size="18" font-weight="600" text-anchor="start" fill="#46515c">身体の強さと守りが上がる</text>
<rect x="16" y="174" width="608" height="88" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="174" width="104" height="88" rx="0" fill="#46515c" stroke="#10131a" stroke-width="3"/>
<text x="68" y="228" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff">絶</text>
<text x="68" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">ゼツ</text>
<text x="136" y="210" font-size="21" font-weight="800" text-anchor="start" fill="#10131a">オーラを断つ</text>
<text x="136" y="242" font-size="18" font-weight="600" text-anchor="start" fill="#46515c">気配が消える。念の守りは無くなる</text>
<rect x="16" y="274" width="608" height="88" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="274" width="104" height="88" rx="0" fill="#d92d20" stroke="#10131a" stroke-width="3"/>
<text x="68" y="328" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff">練</text>
<text x="68" y="354" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">レン</text>
<text x="136" y="310" font-size="21" font-weight="800" text-anchor="start" fill="#10131a">普段より多くオーラを出す</text>
<text x="136" y="342" font-size="18" font-weight="600" text-anchor="start" fill="#46515c">攻めと威圧感が上がる</text>
<rect x="16" y="374" width="608" height="88" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="374" width="104" height="88" rx="0" fill="#7a3fc4" stroke="#10131a" stroke-width="3"/>
<text x="68" y="428" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff">発</text>
<text x="68" y="454" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">ハツ</text>
<text x="136" y="410" font-size="21" font-weight="800" text-anchor="start" fill="#10131a">オーラで特殊な能力を出す</text>
<text x="136" y="442" font-size="18" font-weight="600" text-anchor="start" fill="#46515c">念の集大成。6 つの系統に分かれる</text>
<text x="24" y="486" font-size="17" font-weight="600" text-anchor="start" fill="#46515c">4 つとも 2 サイトで一致。応用技は 4 つを組み合わせて作る</text>
</svg>
