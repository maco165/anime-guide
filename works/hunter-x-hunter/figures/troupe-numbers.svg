<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="troupe-numbers-title troupe-numbers-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="troupe-numbers-title">幻影旅団の団員番号</title>
<desc id="troupe-numbers-desc">団長クロロのもとに 1 番から 12 番までの団員が並ぶ表。ヨークシン編のときの顔ぶれ。団員は番号入りの蜘蛛の刺青を入れる。</desc>
<defs><pattern id="troupe-numbers-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="560" fill="#f1f5f8"/>
<rect width="640" height="560" fill="url(#troupe-numbers-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">旅団は団長と番号付きの 12 人</text>
