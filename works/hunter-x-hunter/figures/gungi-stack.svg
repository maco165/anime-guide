<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="gungi-stack-title gungi-stack-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="gungi-stack-title">軍儀の重ね (ツケ) の決まり</title>
<desc id="gungi-stack-desc">駒を 1 段、2 段、3 段に重ねた 3 つの山を横から描き、動けるのはいちばん上の駒だけであること、重なった駒は同じ高さ以上の駒にしか取られないこと、上級は 3 段まで、入門は 2 段まで重ねられることを示す。駒は自作の円盤で、商品の駒の図柄ではない。</desc>
<defs><pattern id="gungi-stack-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
