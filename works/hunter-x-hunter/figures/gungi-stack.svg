<text x="44" y="432" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">重なった駒を取れるのは、同じ高さ以上の駒だけ</text>
<text x="44" y="462" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">重ねられるのは上級で 3 段まで、入門は 2 段まで</text>
<text x="616" y="134" font-size="15" font-weight="700" text-anchor="end" fill="#46515c">白: 自分 / 灰: 相手</text>
