<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="system-affinity-title system-affinity-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="system-affinity-title">6 つの系統の相性</title>
<desc id="system-affinity-desc">6 つの系統を六角形の頂点に置き、相性が良い組を太い緑の線、悪い組を赤の破線で結んだ図。良い組は隣どうし、悪い組は向かい合う位置になる。</desc>
<defs><pattern id="system-affinity-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="640" fill="#f1f5f8"/>
<rect width="640" height="640" fill="url(#system-affinity-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">相性の良い系統は隣、悪い系統は向かい</text>
<line x1="320.0" y1="130.0" x2="493.2" y2="230.0" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<line x1="320.0" y1="130.0" x2="146.8" y2="230.0" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<line x1="493.2" y1="230.0" x2="493.2" y2="430.0" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<line x1="146.8" y1="230.0" x2="146.8" y2="430.0" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<line x1="320.0" y1="530.0" x2="146.8" y2="430.0" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<line x1="320.0" y1="530.0" x2="493.2" y2="430.0" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<line x1="320.0" y1="130.0" x2="320.0" y2="530.0" stroke="#d92d20" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="493.2" y1="230.0" x2="146.8" y2="430.0" stroke="#d92d20" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="146.8" y1="230.0" x2="493.2" y2="430.0" stroke="#d92d20" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="320.0" cy="130.0" r="52" fill="#d92d20" stroke="#10131a" stroke-width="3.5"/>
<text x="320.0" y="138.0" font-size="23" font-weight="800" text-anchor="middle" fill="#ffffff">強化系</text>
<circle cx="493.2" cy="230.0" r="52" fill="#f5b700" stroke="#10131a" stroke-width="3.5"/>
<text x="493.2" y="238.0" font-size="23" font-weight="800" text-anchor="middle" fill="#10131a">変化系</text>
<circle cx="493.2" cy="430.0" r="52" fill="#1f62d6" stroke="#10131a" stroke-width="3.5"/>
<text x="493.2" y="438.0" font-size="21" font-weight="800" text-anchor="middle" fill="#ffffff">具現化系</text>
<circle cx="320.0" cy="530.0" r="52" fill="#7a3fc4" stroke="#10131a" stroke-width="3.5"/>
<text x="320.0" y="538.0" font-size="23" font-weight="800" text-anchor="middle" fill="#ffffff">特質系</text>
<circle cx="146.8" cy="430.0" r="52" fill="#0b8a5f" stroke="#10131a" stroke-width="3.5"/>
<text x="146.8" y="438.0" font-size="23" font-weight="800" text-anchor="middle" fill="#ffffff">操作系</text>
<circle cx="146.8" cy="230.0" r="52" fill="#e8710a" stroke="#10131a" stroke-width="3.5"/>
<text x="146.8" y="238.0" font-size="23" font-weight="800" text-anchor="middle" fill="#ffffff">放出系</text>
<line x1="40" y1="600" x2="90" y2="600" stroke="#0b8a5f" stroke-width="9" stroke-linecap="round"/>
<text x="100" y="607" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">相性が良い</text>
<line x1="250" y1="600" x2="300" y2="600" stroke="#d92d20" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="310" y="607" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">相性が悪い</text>
<text x="24" y="630" font-size="17" font-weight="600" text-anchor="start" fill="#46515c">並びは相性の記述 (1 サイトのみ) から組んだもので、資料の図ではない</text>
</svg>
