<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="testing-gate-title testing-gate-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="testing-gate-title">ゾルディック家の試しの門</title>
<desc id="testing-gate-desc">7 枚の扉が並ぶ門で、押す力が大きいほど奥の扉まで開き、第 1 の扉は 4 トン、第 7 の扉は 256 トンが要ることを示す。正しく開けないと番犬が襲う。間の扉の重さは資料に無いので書かない。</desc>
<defs><pattern id="testing-gate-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="470" fill="#f1f5f8"/>
<rect width="640" height="470" fill="url(#testing-gate-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">試しの門は力に応じて 7 枚まで開く</text>
<rect x="40" y="260" width="70" height="120" rx="4" fill="#e6edf2" stroke="#10131a" stroke-width="3"/>
<text x="75" y="290" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">1</text>
<rect x="122" y="230" width="70" height="150" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="157" y="260" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">2</text>
<rect x="204" y="200" width="70" height="180" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="239" y="230" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">3</text>
<rect x="286" y="170" width="70" height="210" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="321" y="200" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">4</text>
<rect x="368" y="140" width="70" height="240" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="403" y="170" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">5</text>
<rect x="450" y="110" width="70" height="270" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="485" y="140" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">6</text>
<rect x="532" y="80" width="70" height="300" rx="4" fill="#e6edf2" stroke="#10131a" stroke-width="3"/>
<text x="567" y="110" font-size="22" font-weight="800" text-anchor="middle" fill="#10131a">7</text>
<text x="75" y="420" font-size="20" font-weight="800" text-anchor="middle" fill="#1f62d6">4 トン</text>
<text x="567" y="420" font-size="20" font-weight="800" text-anchor="middle" fill="#d92d20">256 トン</text>
<text x="320" y="420" font-size="18" font-weight="700" text-anchor="middle" fill="#46515c">押す力に応じて奥の扉まで開く</text>
<text x="24" y="456" font-size="17" font-weight="600" text-anchor="start" fill="#46515c">重さは 1 サイトのみ。ククルーマウンテンの麓、敷地の入口にある</text>
</svg>
