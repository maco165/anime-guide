<title id="gungi-arata-title">新 (あらた) で駒を打てる範囲</title>
<desc id="gungi-arata-desc">9 マス四方の盤で、自分の駒のうちいちばん相手側にいる駒の段より手前、つまり自陣側のマスにだけ、手元の駒を打てることを色で示す。いちばん前の駒は、いちばん上に乗っている駒で数える。</desc>
