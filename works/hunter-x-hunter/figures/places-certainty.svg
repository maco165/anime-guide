<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 466" width="640" height="466" role="img" aria-labelledby="places-certainty-title places-certainty-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="places-certainty-title">「世界の場所と勢力」の確かさの印の数</title>
<desc id="places-certainty-desc">公式 0 件、複数サイトで一致 8 件、1 サイトのみ 32 件、説が割れている 0 件の横棒グラフ。</desc>
<defs><pattern id="places-certainty-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="466" fill="#f1f5f8"/>
<rect width="640" height="466" fill="url(#places-certainty-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">確かさの印: 多いのは 1 サイトのみ</text>
<line x1="24.0" y1="84" x2="24.0" y2="348" stroke="#10131a" stroke-width="2" stroke-linecap="round"/>
<text x="24" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">0</text>
<line x1="159.0" y1="84" x2="159.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="159" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">10</text>
<line x1="294.0" y1="84" x2="294.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="294" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">20</text>
<line x1="429.0" y1="84" x2="429.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="429" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">30</text>
<line x1="564.0" y1="84" x2="564.0" y2="348" stroke="#b9c5ce" stroke-width="1" stroke-linecap="round"/>
<text x="564" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">40</text>
<text x="616" y="368" font-size="17" font-weight="500" text-anchor="end" fill="#46515c">件</text>
<text x="32" y="102" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">公式</text>
<text x="34" y="129" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">0</text>
<text x="32" y="166" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">複数サイトで一致</text>
<g data-mark="multi" data-count="8"><path d="M24 174 h104 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-104 z" fill="#1f62d6"/></g>
<text x="142" y="193" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">8</text>
<text x="32" y="230" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<g data-mark="single" data-count="32"><path d="M24 238 h428 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-428 z" fill="#d92d20"/></g>
<text x="466" y="257" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">32</text>
<text x="32" y="294" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">説が割れている</text>
<text x="34" y="321" font-size="22" font-weight="800" text-anchor="start" fill="#10131a">0</text>
<text x="24" y="396" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">印 1 つを 1 件と数えて計 40 件</text>
</svg>
