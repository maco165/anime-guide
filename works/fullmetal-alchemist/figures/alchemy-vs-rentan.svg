<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 590" width="640" height="590" role="img" aria-labelledby="alchemy-vs-rentan-title alchemy-vs-rentan-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="alchemy-vs-rentan-title">錬金術と錬丹術の比較図</title>
<desc id="alchemy-vs-rentan-desc">力の源、使えなくなる場面、位置づけの 3 点でアメストリスの錬金術とシン国の錬丹術を比べ、錬丹術の遠隔錬成を添える。</desc>
<defs><pattern id="alchemy-vs-rentan-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
