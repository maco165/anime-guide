<rect x="16" y="140" width="608" height="30" rx="0" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="320" y="162" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">力の源</text>
<text x="92" y="200.0" font-size="20" font-weight="700" text-anchor="start" fill="#10131a">地殻変動の</text>
<text x="92" y="226.0" font-size="20" font-weight="700" text-anchor="start" fill="#10131a">エネルギー</text>
<text x="346" y="200.0" font-size="20" font-weight="700" text-anchor="start" fill="#10131a">大地や生物を</text>
<text x="346" y="226.0" font-size="20" font-weight="700" text-anchor="start" fill="#10131a">流れる気 (龍脈)</text>
