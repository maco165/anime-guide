<title id="stone-soul-flow-title">賢者の石と魂の流れ</title>
<desc id="stone-soul-flow-desc">多数の人の記号が賢者の石の錬成陣を通って魂を圧縮した石になり、使うたびに中の魂が減って最後に壊れる流れの図。作中の陣の図案は描かない</desc>
