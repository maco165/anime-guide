<text x="126" y="158" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">1</text>
<text x="148" y="158" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">五角形の頂点と辺の中点に人を置く</text>
