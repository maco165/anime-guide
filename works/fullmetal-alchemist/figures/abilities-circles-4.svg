<text x="148" y="306" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">交点で多くの死が要り、発動は日食の</text>
<text x="148" y="328" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">日とされる</text>
