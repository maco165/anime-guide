<rect x="271" y="392" width="48" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="294.56" y="410" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">太陽</text>
