<text x="112" y="530" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">逆転の錬成陣</text>
<rect x="112" y="540" width="96" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="160.0" y="558" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">国土錬成陣</text>
