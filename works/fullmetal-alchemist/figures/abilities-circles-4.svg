<rect x="36" y="102" width="44" height="44" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="2.5"/>
<text x="58.0" y="134.0" font-size="28" font-weight="800" text-anchor="middle" fill="#10131a">陣</text>
<text x="112" y="96" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">賢者の石の陣</text>
<rect x="112" y="106" width="83" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="153.28" y="124" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">2 つの円</text>
<rect x="201" y="106" width="115" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="257.84000000000003" y="124" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">2 つの五角形</text>
<rect x="321" y="106" width="32" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="337.12" y="124" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">人</text>
