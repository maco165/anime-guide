<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 720" width="640" height="720" role="img" aria-labelledby="abilities-circles-4-title abilities-circles-4-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="abilities-circles-4-title">錬成陣の種類: 大きな陣と、仕組みだけを書く陣</title>
<desc id="abilities-circles-4-desc">作中の図案は描かず、形の部品を文字で、置き場所を人の記号で示す: 賢者の石の陣、国土錬成陣、人体錬成の陣 (クセルクセス)、逆転の錬成陣。</desc>
<defs><pattern id="abilities-circles-4-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="720" fill="#f1f5f8"/>
<rect width="640" height="720" fill="url(#abilities-circles-4-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">陣の種類: 大きな陣と、仕組みだけを書く陣</text>
