<text x="340.56" y="410" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">月</text>
<rect x="363" y="392" width="48" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="386.56" y="410" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">双竜</text>
