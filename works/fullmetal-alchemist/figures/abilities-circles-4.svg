<rect x="16" y="356" width="84" height="140" rx="4" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<rect x="36" y="404" width="44" height="44" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="2.5"/>
