<text x="440.56" y="410" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">獅子</text>
<rect x="471" y="392" width="48" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="494.56" y="410" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">文字</text>
<circle cx="126.0" cy="438.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="126" y="444" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">1</text>
<text x="148" y="444" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">部品はこの 7 つと書く記事がある</text>
<circle cx="126.0" cy="470.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="126" y="476" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">4</text>
<text x="148" y="476" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">太陽は魂、月は精神を表す</text>
<rect x="16" y="504" width="608" height="162" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="504" width="84" height="162" rx="4" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<rect x="36" y="563" width="44" height="44" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="2.5"/>
