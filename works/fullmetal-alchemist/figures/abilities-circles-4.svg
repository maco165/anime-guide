<rect x="16" y="186" width="84" height="162" rx="4" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<rect x="36" y="245" width="44" height="44" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="2.5"/>
<text x="58.0" y="277.0" font-size="28" font-weight="800" text-anchor="middle" fill="#10131a">陣</text>
<text x="112" y="212" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">国土錬成陣</text>
