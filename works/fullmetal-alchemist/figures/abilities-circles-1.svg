<title id="abilities-circles-1-title">錬成陣の種類: 持ち物に入れる陣と、基本の形</title>
<desc id="abilities-circles-1-desc">作中の図案は描かず、形の部品を文字で、置き場所を人の記号で示す: 基本の円と構築式、手袋の陣、手甲の陣、籠手と腕輪、鉄甲の陣、鏢の陣。</desc>
