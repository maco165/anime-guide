<line x1="114.0" y1="84.0" x2="114.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="114" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">10</text>
<line x1="204.0" y1="84.0" x2="204.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="204" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">20</text>
<line x1="294.0" y1="84.0" x2="294.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="294" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">30</text>
<line x1="384.0" y1="84.0" x2="384.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="384" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">40</text>
<line x1="474.0" y1="84.0" x2="474.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="474" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">50</text>
<text x="616" y="368" font-size="17" font-weight="500" text-anchor="end" fill="#46515c">件</text>
<text x="32" y="102" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">公式</text>
<g data-mark="official" data-count="11" data-unit="9">
<path d="M24 110 h95 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-95 z" fill="#1f62d6" data-width="99"/>
<text class="value" x="133" y="129" font-size="22" font-weight="800" fill="#10131a">11</text>
</g>
<text x="32" y="166" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">複数サイト</text>
<g data-mark="multi" data-count="55" data-unit="9">
<path d="M24 174 h491 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-491 z" fill="#1f62d6" data-width="495"/>
<text class="value" x="529" y="193" font-size="22" font-weight="800" fill="#10131a">55</text>
</g>
<text x="32" y="230" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<g data-mark="single" data-count="46" data-unit="9">
<path d="M24 238 h410 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-410 z" fill="#d92d20" data-width="414"/>
<text class="value" x="448" y="257" font-size="22" font-weight="800" fill="#10131a">46</text>
</g>
<text x="32" y="294" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">説が割れている</text>
<g data-mark="split" data-count="11" data-unit="9">
<path d="M24 302 h95 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-95 z" fill="#1f62d6" data-width="99"/>
