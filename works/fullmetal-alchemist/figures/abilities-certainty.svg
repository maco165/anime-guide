</g>
<text x="24" y="396" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">印 1 つを 1 件と数えて計 123 件</text>
<text x="24" y="422" font-size="17" font-weight="500" text-anchor="start" fill="#46515c">一致していても写し合いの可能性があり、保証ではありません</text>
<rect x="1.5" y="1.5" width="637" height="437" fill="none" stroke="#10131a" stroke-width="3"/>
