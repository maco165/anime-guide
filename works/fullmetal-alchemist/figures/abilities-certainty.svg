<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="abilities-certainty-title abilities-certainty-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="abilities-certainty-title">このページの記述に付いた確かさの印の数</title>
<desc id="abilities-certainty-desc">公式 11 件、複数サイト 55 件、1 サイトのみ 46 件、説が割れている 11 件の横棒グラフ。</desc>
<defs><pattern id="abilities-certainty-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="440" fill="#f1f5f8"/>
<rect width="640" height="440" fill="url(#abilities-certainty-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">確かさの印: 多いのは複数サイト</text>
<line x1="24.0" y1="84.0" x2="24.0" y2="348.0" stroke="#10131a" stroke-width="2" stroke-linecap="butt"/>
