<svg data-sources="src-016 src-213 src-214 src-215" xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 650" width="640" height="650" role="img" aria-labelledby="sins-recipe-title sins-recipe-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="sins-recipe-title">『物の本性について』の製法と馬の表現の食い違い</title>
<desc id="sins-recipe-desc">蒸留器に入れて 40 日腐敗させ、血で養い、40 週保温する 3 段を記号で示す。下に、馬の扱いが馬糞、馬の胎、馬の胎内と同じ温度、一定温度の実験用語と資料で分かれることを破線の枠で並べる。</desc>
