<text x="114.0" y="274.0" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">精液を器で</text>
<text x="114.0" y="293.55" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">40 日腐敗</text>
<text x="320.0" y="274.0" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">人に似た</text>
<text x="320.0" y="293.55" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">透明なもの</text>
<text x="526.0" y="274.0" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">血で 40 週</text>
<text x="526.0" y="293.55" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">小さな子に</text>
