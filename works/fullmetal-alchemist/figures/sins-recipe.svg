<circle cx="32.0" cy="330.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="32" y="336" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
<text x="54" y="336" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">筋は資料で共通。分かれるのは次の「馬」</text>
<text x="24" y="366" font-size="20" font-weight="800" text-anchor="start" fill="#d92d20">馬の扱いの書き方</text>
<rect x="16" y="380" width="146" height="158" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3" stroke-dasharray="7,4"/>
<text x="89.0" y="420" font-size="26" font-weight="800" text-anchor="middle" fill="#1f62d6">馬糞</text>
<text x="89.0" y="456.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">17 世紀の英訳は</text>
<text x="89.0" y="477.25" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">Horse dung</text>
<text x="89.0" y="518" font-size="17" font-weight="700" text-anchor="middle" fill="#46515c">論考</text>
<rect x="170" y="380" width="146" height="158" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3" stroke-dasharray="7,4"/>
<text x="243.0" y="420" font-size="26" font-weight="800" text-anchor="middle" fill="#1f62d6">馬の胎</text>
<text x="243.0" y="456.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">horse's womb と</text>
<text x="243.0" y="477.25" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">訳し馬糞と注記</text>
<text x="243.0" y="518" font-size="17" font-weight="700" text-anchor="middle" fill="#46515c">英語の事典</text>
<rect x="324" y="380" width="146" height="158" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3" stroke-dasharray="7,4"/>
<text x="397.0" y="420" font-size="26" font-weight="800" text-anchor="middle" fill="#1f62d6">馬の胎内</text>
<text x="397.0" y="456.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">と同じ温度で</text>
<text x="397.0" y="477.25" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">保温すると書く</text>
<text x="397.0" y="518" font-size="17" font-weight="700" text-anchor="middle" fill="#46515c">日本語の事典</text>
<rect x="478" y="380" width="146" height="158" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3" stroke-dasharray="7,4"/>
<text x="551.0" y="420" font-size="26" font-weight="800" text-anchor="middle" fill="#1f62d6">馬の腹</text>
<text x="551.0" y="456.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">一定温度を保つ</text>
<text x="551.0" y="477.25" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">実験の用語とみる</text>
<text x="551.0" y="518" font-size="17" font-weight="700" text-anchor="middle" fill="#46515c">書評</text>
<text x="24" y="566.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">【見立て】 venter equinus の訳し方の差に見える。原典は読んで</text>
<text x="24" y="588.1" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">おらず、刊年 1537 と 1572 の議論も確かめていない</text>
