<title id="homunculus-origin-title">ホムンクルスの成り立ち</title>
<desc id="homunculus-origin-desc">お父様が自分から切り離した面を賢者の石の欠片に移し、お父様の肉の身体か人間の身体に入る分かれ道の図。倒れても魂が尽きるまで復活することを減っていく目盛りで示す</desc>
