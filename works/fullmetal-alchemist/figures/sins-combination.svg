<svg data-sources="src-009 src-213 src-214 src-220" xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 776" width="640" height="776" role="img" aria-labelledby="sins-combination-title sins-combination-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="sins-combination-title">ホムンクルスと七つの大罪の組み合わせ</title>
<desc id="sins-combination-desc">ホムンクルス伝承と七つの大罪を使う作品の 2 つの円が重なるところに、確認できた例として鋼の錬金術師だけを置く図。下に読めなかった資料の数と、作者の発言が見つかっていないことを示す。</desc>
<defs><pattern id="sins-combination-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="776" fill="#f1f5f8"/>
<rect width="640" height="776" fill="url(#sins-combination-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">組み合わせは他に確認できなかった</text>
<g data-unreachable="20" data-works="47">
<circle cx="215.0" cy="226.0" r="150" fill="#e4edfb" stroke="#10131a" stroke-width="3.5"/>
<circle cx="425.0" cy="226.0" r="150" fill="#fdf0ee" stroke="#10131a" stroke-width="3.5"/>
<text x="150" y="196.0" font-size="20" font-weight="800" text-anchor="middle" fill="#10131a">ホムンクルス</text>
<text x="150" y="220.0" font-size="20" font-weight="800" text-anchor="middle" fill="#10131a">伝承</text>
<text x="150" y="260.0" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">七つの大罪と</text>
<text x="150" y="280.4" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">結ぶ記述なし</text>
<text x="490" y="196.0" font-size="20" font-weight="800" text-anchor="middle" fill="#10131a">七つの大罪を</text>
<text x="490" y="220.0" font-size="20" font-weight="800" text-anchor="middle" fill="#10131a">使う作品</text>
<text x="490" y="260.0" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">確認 47 件</text>
<text x="490" y="280.4" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">読んだ範囲で記述なし</text>
<rect x="278" y="192" width="84" height="68" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="320" y="218.0" font-size="17" font-weight="800" text-anchor="middle" fill="#d92d20">鋼の</text>
<text x="320" y="239.25" font-size="17" font-weight="800" text-anchor="middle" fill="#d92d20">錬金術師</text>
<circle cx="320.0" cy="160.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="320" y="166" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
<rect x="16" y="390" width="608" height="160" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="420" font-size="21" font-weight="800" text-anchor="start" fill="#d92d20">「他に無い」とは言えません</text>
<text x="32" y="454.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">見つからなかったのは、読めた資料と日英の検索の範囲です。</text>
<text x="32" y="477.8" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">読めなかったページが 20 件あります。組み合わせの例を探すのに</text>
<text x="32" y="501.6" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">向く TV Tropes の 2 件やピクシブ百科事典、Fandom も含みます。</text>
<text x="32" y="525.4" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">公式ガイドブックや単行本の巻末も読んでいません。</text>
<rect x="16" y="560" width="608" height="160" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<circle cx="38.0" cy="584.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="38" y="590" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">2</text>
<text x="60" y="590" font-size="21" font-weight="800" text-anchor="start" fill="#10131a">作者が選んだ理由の発言も見つかっていない</text>
<text x="32" y="624.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">読めた範囲の発言は別の話題です。賢者の石の概念を読んで錬金術に</text>
<text x="32" y="647.8" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">興味を持ち、実用より哲学的な面に関心があった、という内容でした。</text>
<text x="32" y="671.6" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">英語の記事 1 件は作者の意図を論じますが、発言を引いていません。</text>
<text x="32" y="695.4" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">発言が無いと断定はできません。</text>
</g>
<line x1="14.0" y1="732.0" x2="626.0" y2="732.0" stroke="#10131a" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="30.0" cy="753.0" r="8" fill="#10131a" stroke="#10131a" stroke-width="2"/>
<text x="44" y="759" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">公式・複数サイト</text>
<circle cx="204.0" cy="753.0" r="8" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="218" y="759" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<rect x="338" y="745" width="26" height="16" rx="0" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="372" y="759" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">説が割れている</text>
<rect x="1.5" y="1.5" width="637" height="773" fill="none" stroke="#10131a" stroke-width="3"/>
</svg>
