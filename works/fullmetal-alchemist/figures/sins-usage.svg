<title id="sins-usage-title">七つの大罪を使う作品の使い方の分類</title>
<desc id="sins-usage-desc">資料で確認した 47 作品を、敵の組織や敵役、キャラの称号や役割、構成や章立て、能力や属性や小道具、世界設定や言及、楽曲の概念の 6 つに分けて年順に並べる。個人ブログやファンウィキだけが根拠の作品に白丸を付ける。網羅ではない。</desc>
