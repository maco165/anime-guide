<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 784" width="640" height="784" role="img" aria-labelledby="abilities-state-splits-title abilities-state-splits-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="abilities-state-splits-title">国家錬金術師で資料が割れている点</title>
<desc id="abilities-state-splits-desc">キンブリーの階級と爆発の距離、タッカーの階級と二つ名の表記、コマンチの陣の位置、マルコーの二つ名の注記を、破線の枠で並べる。</desc>
<defs><pattern id="abilities-state-splits-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="784" fill="#f1f5f8"/>
<rect width="640" height="784" fill="url(#abilities-state-splits-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">国家錬金術師: 資料が割れている点</text>
<circle cx="32.0" cy="88.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="94" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">1</text>
<text x="54" y="95" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">キンブリーの階級</text>
<rect x="16" y="108" width="197" height="78" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="115" y="131.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">中佐</text>
<text x="115" y="153.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">戦時の階級とする</text>
<text x="115" y="175.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">資料も</text>
<rect x="221" y="108" width="197" height="78" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="320" y="153.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">少佐</text>
<rect x="427" y="108" width="197" height="78" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="525" y="153.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">少佐から中佐へ</text>
<circle cx="32.0" cy="220.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="226" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">2</text>
<text x="54" y="227" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">キンブリーの爆発の距離</text>
<rect x="16" y="240" width="300" height="34" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="166" y="263.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">手で触れて起こす</text>
<rect x="324" y="240" width="300" height="34" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="474" y="263.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">離れた所も爆破できる</text>
<circle cx="32.0" cy="308.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="314" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">3</text>
<text x="54" y="315" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">タッカーの階級</text>
<rect x="16" y="328" width="300" height="34" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="166" y="351.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">少佐</text>
<rect x="324" y="328" width="300" height="34" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="474" y="351.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">階級の記述がない</text>
<circle cx="32.0" cy="396.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="402" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">4</text>
<text x="54" y="403" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">タッカーの二つ名の表記</text>
<rect x="16" y="416" width="300" height="34" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="166" y="439.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">綴命</text>
<rect x="324" y="416" width="300" height="34" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="474" y="439.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">別名として縫命も載せる</text>
<circle cx="32.0" cy="484.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="490" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">5</text>
<text x="54" y="491" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">コマンチの陣の位置</text>
<rect x="16" y="504" width="197" height="56" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="115" y="527.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">両手や両掌に</text>
<text x="115" y="549.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">書き込んである</text>
<rect x="221" y="504" width="197" height="56" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="320" y="538.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">手に刺青</text>
<rect x="427" y="504" width="197" height="56" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="525" y="538.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">掌と指先に刺青</text>
<circle cx="32.0" cy="594.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="600" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">6</text>
<text x="54" y="601" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">マルコーの「結晶」の注記</text>
<rect x="16" y="614" width="300" height="100" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="166" y="659.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">注記なしで</text>
<text x="166" y="681.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">二つ名として書く</text>
<rect x="324" y="614" width="300" height="100" rx="2" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="474" y="637.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">資料に「アニメ版の二つ名」とある</text>
<text x="474" y="659.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">が、どのアニメ版かは書かれて</text>
<text x="474" y="681.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">おらず、2009 年版で使われた</text>
<text x="474" y="703.0" font-size="17" font-weight="500" text-anchor="middle" fill="#10131a">かは未確認</text>
<line x1="14.0" y1="740.0" x2="626.0" y2="740.0" stroke="#10131a" stroke-width="1.5" stroke-linecap="round"/>
<rect x="30" y="753" width="26" height="16" rx="0" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="64" y="767" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">破線の枠は説が割れている内容です</text>
<rect x="1.5" y="1.5" width="637" height="781" fill="none" stroke="#10131a" stroke-width="3"/>
</svg>
