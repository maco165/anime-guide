<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 466" width="640" height="466" role="img" aria-labelledby="state-certainty-counts-title state-certainty-counts-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="state-certainty-counts-title">「国家と歴史」の確かさの印の数</title>
<desc id="state-certainty-counts-desc">公式 8 件、複数サイトで一致 13 件、1 サイトのみ 14 件、説が割れている 6 件の横棒グラフ。</desc>
<defs><pattern id="state-certainty-counts-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="466" fill="#f1f5f8"/>
<rect width="640" height="466" fill="url(#state-certainty-counts-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">確かさの印: 多いのは 1 サイトのみ</text>
<line x1="24.0" y1="84.0" x2="24.0" y2="348.0" stroke="#10131a" stroke-width="2" stroke-linecap="butt"/>
<text x="24" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">0</text>
<line x1="204.0" y1="84.0" x2="204.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="204" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">5</text>
<line x1="384.0" y1="84.0" x2="384.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="384" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">10</text>
<line x1="564.0" y1="84.0" x2="564.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="564" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">15</text>
<text x="616" y="368" font-size="17" font-weight="500" text-anchor="end" fill="#46515c">件</text>
<text x="32" y="102" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">公式</text>
<g data-mark="official" data-count="8" data-unit="36">
<path d="M24 110 h284 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-284 z" fill="#1f62d6" data-width="288"/>
<text class="value" x="322" y="129" font-size="22" font-weight="800" fill="#10131a">8</text>
</g>
<text x="32" y="166" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">複数サイトで一致</text>
<g data-mark="multi" data-count="13" data-unit="36">
<path d="M24 174 h464 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-464 z" fill="#1f62d6" data-width="468"/>
<text class="value" x="502" y="193" font-size="22" font-weight="800" fill="#10131a">13</text>
</g>
<text x="32" y="230" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<g data-mark="single" data-count="14" data-unit="36">
<path d="M24 238 h500 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-500 z" fill="#d92d20" data-width="504"/>
<text class="value" x="538" y="257" font-size="22" font-weight="800" fill="#10131a">14</text>
</g>
<text x="32" y="294" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">説が割れている</text>
<g data-mark="split" data-count="6" data-unit="36">
<path d="M24 302 h212 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-212 z" fill="#1f62d6" data-width="216"/>
<text class="value" x="250" y="321" font-size="22" font-weight="800" fill="#10131a">6</text>
</g>
<text x="24" y="396" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">印 1 つを 1 件と数えて計 41 件</text>
<text x="24" y="422" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">複数サイトの内訳: 2 サイト 11 件、3 サイト 1 件、4 サイト 1 件</text>
<text x="24" y="448" font-size="17" font-weight="500" text-anchor="start" fill="#46515c">一致していても写し合いの可能性があり、保証ではありません</text>
<rect x="1.5" y="1.5" width="637" height="463" fill="none" stroke="#10131a" stroke-width="3"/>
</svg>
