<text x="60" y="784" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">悲嘆と怠惰をどうしたか</text>
<text x="32" y="814.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">グレゴリウスの本文: melancholy (悲嘆) が七つの中にある</text>
<text x="32" y="836.95" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">事典の一節: 怠惰を外し、悲嘆をその根と教えた</text>
<text x="32" y="859.9" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">別の事典の一節: 2 つを合わせて怠惰にした</text>
<text x="32" y="888" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">トマスは怠惰を戻し悲嘆を外す。カテキズムも sloth or acedia</text>
