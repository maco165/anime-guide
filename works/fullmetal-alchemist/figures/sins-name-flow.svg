<title id="sins-name-flow-title">罪の名の変遷</title>
<desc id="sins-name-flow-desc">縦に 9 つの罪の名、横に 6 つの資料を置いた行列。8 つの一覧が 7 つへ変わり、高慢が別格になり、嫉妬が加わり、悲嘆と怠惰が入れ替わり、虚栄が消える。下に虚栄の統合と悲嘆と怠惰の扱いについて資料の食い違いを破線の枠で並べる。</desc>
