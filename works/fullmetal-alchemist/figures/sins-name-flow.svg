<text x="60" y="620" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">虚栄はいつ高慢へまとめられたか</text>
<text x="32" y="650.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">グレゴリウスの本文: 七つの中に虚栄がある (行列はこれに従う)</text>
<text x="32" y="672.95" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">事典の一節: グレゴリウスがまとめた</text>
<text x="32" y="695.9" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">事典の別の節: ベラルミーノがまとめた</text>
<text x="32" y="724" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">ダンテの段に虚栄は既になく、高慢が入っている</text>
