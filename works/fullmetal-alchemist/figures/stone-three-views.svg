<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">賢者の石は等価交換の外にあるか</text>
<rect x="16" y="76" width="196" height="372" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3.5" stroke-dasharray="10,6"/>
<text x="30" y="106" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">書き方 1</text>
<rect x="30" y="120" width="168" height="132" rx="0" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<text x="42" y="144" font-size="17" font-weight="700" text-anchor="start" fill="#10131a">等価交換</text>
<text x="114" y="300.0" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">等価交換を無視</text>
<text x="114" y="323.4" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">できる唯一の</text>
<text x="114" y="346.8" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">例外とする</text>
<rect x="30" y="374" width="168" height="38" rx="4" fill="#10131a" stroke="#10131a" stroke-width="2"/>
<text x="114.0" y="399.48" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">唯一の例外</text>
<text x="114" y="436" font-size="16" font-weight="500" text-anchor="middle" fill="#46515c">[src-077]</text>
<rect x="222" y="76" width="196" height="372" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3.5" stroke-dasharray="10,6"/>
<text x="236" y="106" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">書き方 2</text>
<rect x="236" y="120" width="168" height="132" rx="0" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<text x="248" y="144" font-size="17" font-weight="700" text-anchor="start" fill="#10131a">等価交換</text>
<text x="320" y="300.0" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">体内に石を持つ</text>
<text x="320" y="323.4" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">お父様は</text>
<text x="320" y="346.8" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">縛られないとする</text>
<rect x="236" y="374" width="168" height="38" rx="4" fill="#10131a" stroke="#10131a" stroke-width="2"/>
<text x="320.0" y="399.48" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">縛られない</text>
<text x="320" y="436" font-size="16" font-weight="500" text-anchor="middle" fill="#46515c">[src-078]</text>
<rect x="428" y="76" width="196" height="372" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3.5" stroke-dasharray="10,6"/>
<text x="442" y="106" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">書き方 3</text>
<rect x="442" y="120" width="168" height="132" rx="0" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<text x="454" y="144" font-size="17" font-weight="700" text-anchor="start" fill="#10131a">等価交換</text>
<text x="526" y="300.0" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">代価を石に</text>
<text x="526" y="323.4" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">肩代わりさせて</text>
<text x="526" y="346.8" font-size="18" font-weight="700" text-anchor="middle" fill="#10131a">いるだけとする</text>
<rect x="442" y="374" width="168" height="38" rx="4" fill="#10131a" stroke="#10131a" stroke-width="2"/>
