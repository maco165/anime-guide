<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 510" width="640" height="510" role="img" aria-labelledby="stone-three-views-title stone-three-views-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="stone-three-views-title">賢者の石と等価交換の 3 つの書き方</title>
<desc id="stone-three-views-desc">賢者の石が等価交換の外にあるかについて、唯一の例外とする書き方、お父様は縛られないとする書き方、代価を肩代わりさせているだけとする書き方を並べる。</desc>
<defs><pattern id="stone-three-views-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
