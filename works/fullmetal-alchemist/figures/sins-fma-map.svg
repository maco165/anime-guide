<text x="247" y="295" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">美貌で人心を惑わす</text>
<rect x="16" y="319" width="608" height="103" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="319" width="118" height="103" rx="4" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="75" y="354.5" font-size="26" font-weight="800" text-anchor="middle" fill="#ffffff">強欲</text>
<text x="75" y="380.5" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">グリード</text>
<text x="75" y="404.5" font-size="17" font-weight="500" text-anchor="middle" fill="#ced8e0">3 番目</text>
<rect x="142" y="332" width="46" height="22" rx="3" fill="#1f62d6" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="348" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="348" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">炭素を組み換えて覆う「最強の盾」</text>
