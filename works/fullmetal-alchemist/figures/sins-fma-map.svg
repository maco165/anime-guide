<text x="165.0" y="517" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">考察</text>
<text x="196" y="517" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">他人の姿を奪うことが嫉妬に重なる</text>
<rect x="16" y="541" width="608" height="103" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
