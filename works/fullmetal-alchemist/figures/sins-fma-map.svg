<svg data-sources="src-002 src-042 src-078 src-217 src-218 src-219 src-220" xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 970" width="640" height="970" role="img" aria-labelledby="sins-fma-map-title sins-fma-map-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="sins-fma-map-title">7 人のホムンクルスの罪と能力</title>
<desc id="sins-fma-map-desc">7 人のホムンクルスを生まれた順に並べ、罪、能力、罪との結びつきを 1 枚に示す。各行に公式、ゲーム公式、解説、考察の区別を札で付ける。プライドは公式のキャラ紹介に項が無い。</desc>
<defs><pattern id="sins-fma-map-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="970" fill="#f1f5f8"/>
<rect width="640" height="970" fill="url(#sins-fma-map-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">7 人の罪と能力を 1 枚に</text>
<rect x="16" y="68" width="608" height="103" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="68" width="118" height="103" rx="4" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="75" y="103.5" font-size="26" font-weight="800" text-anchor="middle" fill="#ffffff">傲慢</text>
<text x="75" y="129.5" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">プライド</text>
<text x="75" y="153.5" font-size="17" font-weight="500" text-anchor="middle" fill="#ced8e0">1 番目</text>
<rect x="142" y="81" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="97" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="97" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">影を操る。光が要る</text>
<rect x="142" y="110" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="126" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="126" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">最初に造られ、兄弟を対等に見ない</text>
<rect x="142" y="139" width="46" height="22" rx="3" fill="#1f62d6" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="155" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="155" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">キャラ紹介に傲慢の項が無い</text>
<rect x="16" y="179" width="608" height="132" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="179" width="118" height="132" rx="4" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="75" y="229.0" font-size="26" font-weight="800" text-anchor="middle" fill="#ffffff">色欲</text>
<text x="75" y="255.0" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">ラスト</text>
<text x="75" y="279.0" font-size="17" font-weight="500" text-anchor="middle" fill="#ced8e0">2 番目</text>
<rect x="142" y="192" width="46" height="22" rx="3" fill="#1f62d6" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="208" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="208" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">爪を鉄も貫く「最強の矛」に変える</text>
<rect x="142" y="221" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="237" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="237" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">爪でなく指先と書く資料が多い</text>
<rect x="142" y="250" width="46" height="22" rx="3" fill="#1f62d6" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="266" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="266" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">妖艶な容姿。能力と罪の説明は無い</text>
