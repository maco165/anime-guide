<rect x="16" y="430" width="118" height="103" rx="4" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="75" y="465.5" font-size="26" font-weight="800" text-anchor="middle" fill="#ffffff">嫉妬</text>
<text x="75" y="491.5" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">エンヴィー</text>
<text x="75" y="515.5" font-size="17" font-weight="500" text-anchor="middle" fill="#ced8e0">4 番目</text>
<rect x="142" y="443" width="46" height="22" rx="3" fill="#1f62d6" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="459" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="459" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">一度見たものに瞬時に変身する</text>
<rect x="142" y="472" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="488" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="488" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">人間の精神的な強さへの嫉妬が本質</text>
