<text x="165.0" y="681" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="681" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">並外れた嗅覚と強力なパワー</text>
<rect x="142" y="694" width="46" height="22" rx="3" fill="#1f62d6" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="710" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="710" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">生き物すべてを食べたがる異常な食欲</text>
<rect x="142" y="723" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="739" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="739" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">何でも食べる。腹は扉の失敗作</text>
<rect x="16" y="763" width="608" height="103" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="763" width="118" height="103" rx="4" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<text x="75" y="798.5" font-size="26" font-weight="800" text-anchor="middle" fill="#ffffff">憤怒</text>
<text x="75" y="824.5" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">ラース</text>
