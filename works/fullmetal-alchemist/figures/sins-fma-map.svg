<text x="165.0" y="599" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="599" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">超高速で動く。公式の紹介には無い</text>
<rect x="142" y="612" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2" stroke-dasharray="5,3"/>
<text x="165.0" y="628" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">考察</text>
<text x="196" y="628" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">速さを縛る鎖を怠惰の足かせと読む</text>
