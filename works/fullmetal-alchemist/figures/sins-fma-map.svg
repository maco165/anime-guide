<text x="165.0" y="570" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="570" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">怪力と強靭さ。「めんどくせー」が口癖</text>
