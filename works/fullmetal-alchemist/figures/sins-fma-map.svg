<text x="165.0" y="377" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">公式</text>
<text x="196" y="377" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">名のとおり全てを欲しがる性格</text>
<rect x="142" y="390" width="46" height="22" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="165.0" y="406" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">解説</text>
<text x="196" y="406" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">金や命まで、あらゆるものを求める</text>
