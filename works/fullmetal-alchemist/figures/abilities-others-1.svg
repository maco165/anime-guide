<title id="abilities-others-1-title">国家資格の記述がない使い手 1: アルフォンス、イズミ、ホーエンハイム</title>
<desc id="abilities-others-1-desc">アルフォンス、イズミ、ホーエンハイムの立場、得意な術、錬成の方法、制限を人物ごとのカードで示す。</desc>
