<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 466" width="640" height="466" role="img" aria-labelledby="life-certainty-counts-title life-certainty-counts-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="life-certainty-counts-title">「人間と命」の確かさの印の数</title>
<desc id="life-certainty-counts-desc">公式 9 件、複数サイトで一致 7 件、1 サイトのみ 18 件、説が割れている 0 件の横棒グラフ。</desc>
<defs><pattern id="life-certainty-counts-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="466" fill="#f1f5f8"/>
<rect width="640" height="466" fill="url(#life-certainty-counts-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">確かさの印: 多いのは 1 サイトのみ</text>
<line x1="24.0" y1="84.0" x2="24.0" y2="348.0" stroke="#10131a" stroke-width="2" stroke-linecap="butt"/>
<text x="24" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">0</text>
<line x1="174.0" y1="84.0" x2="174.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="174" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">5</text>
<line x1="324.0" y1="84.0" x2="324.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="324" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">10</text>
<line x1="474.0" y1="84.0" x2="474.0" y2="348.0" stroke="#b9c5ce" stroke-width="1" stroke-linecap="butt"/>
<text x="474" y="368" font-size="17" font-weight="500" text-anchor="middle" fill="#46515c">15</text>
<text x="616" y="368" font-size="17" font-weight="500" text-anchor="end" fill="#46515c">件</text>
<text x="32" y="102" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">公式</text>
<g data-mark="official" data-count="9" data-unit="30">
<path d="M24 110 h266 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-266 z" fill="#1f62d6" data-width="270"/>
<text class="value" x="304" y="129" font-size="22" font-weight="800" fill="#10131a">9</text>
</g>
<text x="32" y="166" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">複数サイトで一致</text>
<g data-mark="multi" data-count="7" data-unit="30">
<path d="M24 174 h206 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-206 z" fill="#1f62d6" data-width="210"/>
<text class="value" x="244" y="193" font-size="22" font-weight="800" fill="#10131a">7</text>
</g>
<text x="32" y="230" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<g data-mark="single" data-count="18" data-unit="30">
<path d="M24 238 h536 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-536 z" fill="#d92d20" data-width="540"/>
<text class="value" x="574" y="257" font-size="22" font-weight="800" fill="#10131a">18</text>
</g>
<text x="32" y="294" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">説が割れている</text>
<g data-mark="split" data-count="0" data-unit="30">
<path d="M24 302 h0 a0 0 0 0 1 0 0 v24 z" fill="#1f62d6" data-width="0"/>
<text class="value" x="34" y="321" font-size="22" font-weight="800" fill="#10131a">0</text>
</g>
<text x="24" y="396" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">印 1 つを 1 件と数えて計 34 件</text>
<text x="24" y="422" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">複数サイトの内訳: 2 サイト 5 件、3 サイト 2 件</text>
<text x="24" y="448" font-size="17" font-weight="500" text-anchor="start" fill="#46515c">一致していても写し合いの可能性があり、保証ではありません</text>
<rect x="1.5" y="1.5" width="637" height="463" fill="none" stroke="#10131a" stroke-width="3"/>
</svg>
