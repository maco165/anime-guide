<text x="152.0" y="124" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">血で描く</text>
<rect x="198" y="106" width="80" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="238.0" y="124" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">鎧の内側</text>
