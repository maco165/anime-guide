<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 540" width="640" height="540" role="img" aria-labelledby="abilities-circles-3-title abilities-circles-3-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="abilities-circles-3-title">錬成陣の種類: 魂や気に関わる陣</title>
<desc id="abilities-circles-3-desc">作中の図案は描かず、形の部品を文字で、置き場所を人の記号で示す: 血印、錬丹術の陣、傷を治す陣。</desc>
<defs><pattern id="abilities-circles-3-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
