<text x="126" y="158" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
<text x="148" y="158" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">血で描いた陣が魂と鎧をつなぐ。</text>
<text x="148" y="180" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">壊れるとつながりが切れる</text>
<rect x="16" y="208" width="608" height="140" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="208" width="84" height="140" rx="4" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
