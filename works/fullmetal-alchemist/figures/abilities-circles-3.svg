<text x="148" y="296" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">五芒星を基にする</text>
<circle cx="126.0" cy="322.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="126" y="328" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">3</text>
<text x="148" y="328" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">手元と的に 2 つ作って遠くを錬成</text>
<rect x="16" y="356" width="608" height="130" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<rect x="16" y="356" width="84" height="130" rx="4" fill="#e4edfb" stroke="#10131a" stroke-width="3"/>
<rect x="36" y="399" width="44" height="44" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="2.5"/>
<text x="58.0" y="431.0" font-size="28" font-weight="800" text-anchor="middle" fill="#10131a">陣</text>
<text x="112" y="382" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">傷を治す陣</text>
<text x="219.0" y="382" font-size="16" font-weight="600" text-anchor="start" fill="#46515c">錬丹術の使い手</text>
<rect x="112" y="392" width="112" height="25" rx="3" fill="#ffffff" stroke="#10131a" stroke-width="2"/>
<text x="168.0" y="410" font-size="16" font-weight="600" text-anchor="middle" fill="#10131a">形の記述なし</text>
<circle cx="126.0" cy="438.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="126" y="444" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">4</text>
<text x="148" y="444" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">陣の上に傷を置き、体内の力の流れで</text>
<text x="148" y="466" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">直す。なくなった物は戻せない</text>
<line x1="14.0" y1="496.0" x2="626.0" y2="496.0" stroke="#10131a" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="30.0" cy="517.0" r="8" fill="#10131a" stroke="#10131a" stroke-width="2"/>
<text x="44" y="523" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">公式・複数サイト</text>
<circle cx="204.0" cy="517.0" r="8" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="218" y="523" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<rect x="338" y="509" width="26" height="16" rx="0" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="372" y="523" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">説が割れている</text>
