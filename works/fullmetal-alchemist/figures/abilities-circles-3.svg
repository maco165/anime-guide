<text x="112" y="96" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">血印</text>
<text x="162.0" y="96" font-size="16" font-weight="600" text-anchor="start" fill="#46515c">エドが描き、アルの鎧に残る</text>
