<text x="258" y="349" font-size="17" font-weight="500" text-anchor="start" fill="#46515c">発動の記述は見つからず</text>
<line x1="174.0" y1="360.0" x2="616.0" y2="360.0" stroke="#dde5eb" stroke-width="1.5" stroke-linecap="round"/>
