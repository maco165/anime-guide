<title id="abilities-others-3-title">国家資格の記述がない使い手 3: お父様、ベルトルト、コーネロ</title>
<desc id="abilities-others-3-desc">お父様、ベルトルト、コーネロの立場、得意な術、錬成の方法、制限を人物ごとのカードで示す。</desc>
