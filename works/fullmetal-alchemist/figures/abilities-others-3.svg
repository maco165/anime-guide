<text x="258" y="135" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">国内の錬金術を封じる</text>
<line x1="174.0" y1="146.0" x2="616.0" y2="146.0" stroke="#dde5eb" stroke-width="1.5" stroke-linecap="round"/>
