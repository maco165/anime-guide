<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 612" width="640" height="612" role="img" aria-labelledby="amestris-schematic-title amestris-schematic-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="amestris-schematic-title">アメストリスの模式図</title>
<desc id="amestris-schematic-desc">円を中央と東西南北の 5 つに分けた自作の模式図。東の外に大砂漠と古代の王国クセルクセスを記号で示す。公式の地図ではない</desc>
<defs><pattern id="amestris-schematic-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
