<text x="60" y="102.2" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">軍事国家。国軍の最高責任者は</text>
<text x="60" y="128.2" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">大総統キング・ブラッドレイ</text>
