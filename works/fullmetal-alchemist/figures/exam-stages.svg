<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="exam-stages-title exam-stages-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="exam-stages-title">試験の段階の 2 つの書き方</title>
<desc id="exam-stages-desc">国家錬金術師の試験について、4 段階とする書き方と 3 つとする書き方を破線の枠で並べた図。筆記と実技の場面は 2003 年版で描かれた、と 4 段階の資料が書くことも記す</desc>
