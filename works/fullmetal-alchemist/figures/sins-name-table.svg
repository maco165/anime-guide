<text x="188" y="280" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">sorrow / sadness</text>
<text x="332" y="280" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">lype</text>
<text x="510" y="280" font-size="17" font-weight="800" text-anchor="start" fill="#10131a">—</text>
