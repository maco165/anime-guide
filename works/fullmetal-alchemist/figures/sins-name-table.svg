<svg data-sources="src-201 src-203 src-207 src-209 src-217" xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 668" width="640" height="668" role="img" aria-labelledby="sins-name-table-title sins-name-table-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="sins-name-table-title">七つの大罪のラテン語名と英語名</title>
<desc id="sins-name-table-desc">日本語、ラテン語、英語、エウァグリオスのギリシア語、作中の名の 5 列で 10 行の対応表を示す。虚栄と悲嘆には作中の名がない。作中の名は英語名を片仮名にしたものになる。</desc>
<defs><pattern id="sins-name-table-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
