<text x="24" y="356" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">怠惰</text>
<text x="82" y="356" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">pigritia</text>
<text x="188" y="356" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">sloth</text>
<text x="332" y="356" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">—</text>
<text x="510" y="356" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">スロウス</text>
