<text x="82" y="318" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">acedia</text>
<text x="188" y="318" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">sloth</text>
<text x="332" y="318" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">akedia</text>
<text x="510" y="318" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">スロウス</text>
