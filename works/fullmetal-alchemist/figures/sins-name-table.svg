<text x="82" y="166" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">vanagloria</text>
<text x="188" y="166" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">vainglory</text>
<text x="332" y="166" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">kenodoxia</text>
<text x="510" y="166" font-size="17" font-weight="800" text-anchor="start" fill="#10131a">—</text>
