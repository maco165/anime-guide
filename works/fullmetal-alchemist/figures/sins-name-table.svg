<text x="24" y="432" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">暴食</text>
<text x="82" y="432" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">gula</text>
<text x="188" y="432" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">gluttony</text>
<text x="332" y="432" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">gastrimargia</text>
<text x="510" y="432" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">グラトニー</text>
<rect x="16" y="444" width="608" height="38" rx="0" fill="#ffffff" stroke="#10131a" stroke-width="1.5"/>
<text x="24" y="470" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">色欲</text>
<text x="82" y="470" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">luxuria</text>
<text x="188" y="470" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">lust</text>
<text x="332" y="470" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">porneia (淫行)</text>
<text x="510" y="470" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">ラスト</text>
<circle cx="32.0" cy="504.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="510" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">1</text>
<text x="54" y="510.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">同じ superbia が資料で「高慢」とも「傲慢」とも訳される。作中は傲慢</text>
<text x="54" y="532.95" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">カッシアヌスの fornicatio をグレゴリウスが luxuria に置き換えた</text>
<circle cx="32.0" cy="562.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="32" y="568" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">2</text>
<text x="54" y="568.0" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">acedia は元は修道士の霊的な倦怠。sloth へ移った時期は特定できて</text>
<text x="54" y="590.95" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">いない。pigritia はカテキズムの日本語解説が並べる語</text>
<line x1="14.0" y1="624.0" x2="626.0" y2="624.0" stroke="#10131a" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="30.0" cy="645.0" r="8" fill="#10131a" stroke="#10131a" stroke-width="2"/>
