<text x="24" y="394" font-size="18" font-weight="800" text-anchor="start" fill="#10131a">強欲</text>
<text x="82" y="394" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">avaritia</text>
<text x="188" y="394" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">greed / avarice</text>
<text x="332" y="394" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">philargyria</text>
<text x="510" y="394" font-size="17" font-weight="800" text-anchor="start" fill="#d92d20">グリード</text>
