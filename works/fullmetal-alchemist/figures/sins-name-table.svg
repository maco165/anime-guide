<text x="218" y="651" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<rect x="338" y="637" width="26" height="16" rx="0" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="372" y="651" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">説が割れている</text>
