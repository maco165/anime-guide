<title id="sins-father-title">お父様と 7 人の関係</title>
<desc id="sins-father-desc">中央のお父様の記号から 7 つの欠片が放射状に分かれ、生まれた順の番号と罪の名が付く。下に、切り離した対象の呼び方が魂、感情、欠点、罪と資料で揺れることを 4 つの破線の枠で示す。</desc>
