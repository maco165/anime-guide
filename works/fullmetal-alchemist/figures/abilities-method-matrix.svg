<title id="abilities-method-matrix-title">誰がどの方法を使うかの行列</title>
<desc id="abilities-method-matrix-desc">国家錬金術師 9 人とほかの使い手 8 人を行に、方法の 5 段階を列にした行列。印は資料の確かさを示し、空欄は記述が見つからないという意味。</desc>
