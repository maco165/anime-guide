<text x="486.5" y="118" font-size="16" font-weight="800" text-anchor="middle" fill="#10131a">合わせる</text>
<text x="577.5" y="98" font-size="16" font-weight="800" text-anchor="middle" fill="#10131a">陣も動作</text>
<text x="577.5" y="118" font-size="16" font-weight="800" text-anchor="middle" fill="#10131a">も不要</text>
