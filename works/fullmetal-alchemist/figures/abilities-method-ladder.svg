<text x="136" y="230" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">手袋、手甲、籠手、鏢に入れておく</text>
<text x="136" y="254" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">擦る、叩く、打ち合わせる、投げる</text>
