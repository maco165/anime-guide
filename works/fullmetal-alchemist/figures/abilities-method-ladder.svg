<text x="202" y="516" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">5 陣も動作も不要</text>
<text x="202" y="542" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">賢者の石を体に持つ者について書かれる</text>
<text x="202" y="566" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">手を合わせることも要らない</text>
