<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 670" width="640" height="670" role="img" aria-labelledby="abilities-method-ladder-title abilities-method-ladder-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="abilities-method-ladder-title">錬成の方法の 5 段階</title>
<desc id="abilities-method-ladder-desc">陣を描く、持ち物に刻む、身体に刻む、手を合わせる、陣も動作も不要、の 5 段階を、用意するものと動作で比べる。</desc>
