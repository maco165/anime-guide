<text x="180" y="438" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">両手で円を作り、陣を省く</text>
<text x="180" y="462" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">真理を見た者だけができる</text>
