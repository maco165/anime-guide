<text x="114" y="126" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">その場で円と構築式を描く</text>
<text x="114" y="150" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">描くものと時間が要る</text>
