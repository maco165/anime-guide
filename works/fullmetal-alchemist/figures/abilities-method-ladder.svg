<text x="158" y="308" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">3 身体に刻む</text>
<text x="158" y="334" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">掌や腕の皮膚に入れておく</text>
<text x="158" y="358" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">合わせる、触れる</text>
