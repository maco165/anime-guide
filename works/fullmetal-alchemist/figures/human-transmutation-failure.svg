<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 830" width="640" height="830" role="img" aria-labelledby="human-transmutation-failure-title human-transmutation-failure-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
<title id="human-transmutation-failure-title">人体錬成が失敗する理由</title>
<desc id="human-transmutation-failure-desc">死者へ向かう矢印が赤い壁で止まる図。失敗の理由として挙げられる 3 点、半端な怪物が生まれること、代償が術者の身体に及ぶことを示す</desc>
<defs><pattern id="human-transmutation-failure-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dde5eb" stroke-width="1"/></pattern></defs>
<rect width="640" height="830" fill="#f1f5f8"/>
<rect width="640" height="830" fill="url(#human-transmutation-failure-grid)"/>
<rect x="0" y="0" width="640" height="56" fill="#10131a"/>
<polygon points="0,0 34,0 16,56 0,56" fill="#d92d20"/>
<polygon points="42,0 52,0 34,56 24,56" fill="#f5b700"/>
<text x="60" y="37" font-size="23" font-weight="800" fill="#ffffff">人体錬成はなぜ失敗するとされるか</text>
<rect x="16" y="72" width="608" height="60" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<circle cx="38.0" cy="102.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="38" y="108.0" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
<text x="60" y="109.2" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">最大の禁忌。兄弟は亡くなった母を想って犯した</text>
<text x="16" y="164" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">失敗の理由として挙げられること</text>
<rect x="16" y="178" width="250" height="92" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<circle cx="38.0" cy="202.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="38" y="208" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">4</text>
<text x="60" y="218.8" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">材料の一覧が</text>
<text x="60" y="242.2" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">精確でも失敗する</text>
<rect x="16" y="280" width="250" height="118" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<circle cx="38.0" cy="304.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="38" y="310" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">5</text>
<text x="60" y="308.0" font-size="17" font-weight="700" text-anchor="start" fill="#10131a">原作を論じた論文では、</text>
<text x="60" y="329.76" font-size="17" font-weight="700" text-anchor="start" fill="#10131a">兄弟は魂の対価が分から</text>
<text x="60" y="351.52" font-size="17" font-weight="700" text-anchor="start" fill="#10131a">ず、血を数滴入れただけ</text>
<line x1="266.0" y1="224.0" x2="284.0" y2="224.0" stroke="#10131a" stroke-width="4" stroke-linecap="round"/>
<line x1="266.0" y1="339.0" x2="284.0" y2="339.0" stroke="#10131a" stroke-width="4" stroke-linecap="round"/>
<line x1="284.0" y1="224.0" x2="284.0" y2="339.0" stroke="#10131a" stroke-width="4" stroke-linecap="round"/>
<path d="M284.0 288.0 L308.0 288.0" fill="none" stroke="#10131a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="322.0,288.0 308.0,298.1 308.0,277.9" fill="#10131a" stroke="#10131a" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="326" y="178" width="18" height="220" rx="0" fill="#d92d20" stroke="#10131a" stroke-width="3"/>
<line x1="326.0" y1="192.0" x2="344.0" y2="214.0" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
<line x1="326.0" y1="234.0" x2="344.0" y2="256.0" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
<line x1="326.0" y1="276.0" x2="344.0" y2="298.0" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
<line x1="326.0" y1="318.0" x2="344.0" y2="340.0" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
<line x1="326.0" y1="360.0" x2="344.0" y2="382.0" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
<rect x="362" y="178" width="262" height="220" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3.5"/>
<circle cx="432.0" cy="215.0" r="15.0" fill="#ffffff" stroke="#46515c" stroke-width="5"/>
<line x1="432.0" y1="230.0" x2="432.0" y2="269.0" stroke="#46515c" stroke-width="5" stroke-linecap="round"/>
<line x1="432.0" y1="269.0" x2="414.0" y2="311.0" stroke="#46515c" stroke-width="5" stroke-linecap="round"/>
<line x1="432.0" y1="269.0" x2="450.0" y2="311.0" stroke="#46515c" stroke-width="5" stroke-linecap="round"/>
<line x1="432.0" y1="239.0" x2="409.5" y2="269.0" stroke="#46515c" stroke-width="5" stroke-linecap="round"/>
<line x1="432.0" y1="239.0" x2="454.5" y2="269.0" stroke="#46515c" stroke-width="5" stroke-linecap="round"/>
<circle cx="432.0" cy="215.0" r="15" fill="#ffffff" stroke="#46515c" stroke-width="5" stroke-dasharray="6,5"/>
<text x="432" y="348" font-size="20" font-weight="800" text-anchor="middle" fill="#10131a">死者</text>
<circle cx="498.0" cy="218.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="498" y="224" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">3</text>
<text x="494" y="262.0" font-size="17.5" font-weight="800" text-anchor="start" fill="#10131a">存在しない</text>
<text x="494" y="284.4" font-size="17.5" font-weight="800" text-anchor="start" fill="#10131a">ものは</text>
<text x="494" y="306.8" font-size="17.5" font-weight="800" text-anchor="start" fill="#10131a">錬成できない</text>
<rect x="16" y="412" width="608" height="58" rx="0" fill="#10131a" stroke="#10131a" stroke-width="3"/>
<circle cx="40.0" cy="441.0" r="17" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<circle cx="40.0" cy="441.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="40" y="447" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">2</text>
<text x="66" y="449" font-size="22" font-weight="800" text-anchor="start" fill="#ffffff">死者の復活を目指す試みは必ず失敗する</text>
<path d="M160.0 474.0 L160.0 489.0" fill="none" stroke="#d92d20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="160.0,504.0 149.2,489.0 170.8,489.0" fill="#d92d20" stroke="#d92d20" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M480.0 474.0 L480.0 489.0" fill="none" stroke="#d92d20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="480.0,504.0 469.2,489.0 490.8,489.0" fill="#d92d20" stroke="#d92d20" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="16" y="508" width="298" height="268" rx="4" fill="#fdeceb" stroke="#10131a" stroke-width="3.5"/>
<text x="30" y="540" font-size="21" font-weight="800" text-anchor="start" fill="#10131a">結果</text>
<polygon points="165.0,570.0 200.0,586.0 232.0,580.0 222.0,620.0 246.0,650.0 206.0,656.0 188.0,694.0 160.0,666.0 116.0,680.0 122.0,642.0 88.0,620.0 126.0,604.0 118.0,574.0" fill="#98a8b5" stroke="#10131a" stroke-width="4" stroke-linejoin="round"/>
<text x="165" y="636" font-size="16" font-weight="500" text-anchor="middle" fill="#10131a">(記号)</text>
<circle cx="38.0" cy="740.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="38" y="746" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">6</text>
<text x="60" y="747" font-size="19" font-weight="800" text-anchor="start" fill="#10131a">半端な怪物が生まれる</text>
<rect x="326" y="508" width="298" height="164" rx="4" fill="#fdeceb" stroke="#10131a" stroke-width="3.5"/>
<circle cx="348.0" cy="534.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="348" y="540" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">9</text>
<text x="370" y="541" font-size="20" font-weight="800" text-anchor="start" fill="#10131a">代償は術者の身体に及ぶ</text>
<circle cx="348.0" cy="574.0" r="14" fill="#10131a" stroke="#10131a" stroke-width="2.5"/>
<text x="348" y="580" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">7</text>
<text x="370" y="574.0" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">イズミは子の蘇生に</text>
<text x="370" y="597.4" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">失敗して内臓の</text>
<text x="370" y="620.8" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">一部を失った</text>
<text x="340" y="658" font-size="17" font-weight="500" text-anchor="start" fill="#46515c">扉へ飛ばされる話は図 1-8</text>
<rect x="326" y="684" width="298" height="92" rx="4" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<circle cx="348.0" cy="730.0" r="14" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="348" y="736" font-size="17" font-weight="800" text-anchor="middle" fill="#10131a">8</text>
<text x="370" y="724.0" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">行った国家錬金術師は</text>
<text x="370" y="747.4" font-size="18" font-weight="700" text-anchor="start" fill="#10131a">資格を奪われる</text>
<line x1="14.0" y1="786.0" x2="626.0" y2="786.0" stroke="#10131a" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="30.0" cy="807.0" r="8" fill="#10131a" stroke="#10131a" stroke-width="2"/>
<text x="44" y="813" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">公式・複数サイト</text>
<circle cx="204.0" cy="807.0" r="8" fill="#ffffff" stroke="#10131a" stroke-width="3"/>
<text x="218" y="813" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">1 サイトのみ</text>
<rect x="338" y="799" width="26" height="16" rx="0" fill="#ffffff" stroke="#10131a" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="372" y="813" font-size="17" font-weight="500" text-anchor="start" fill="#10131a">説が割れている</text>
<rect x="1.5" y="1.5" width="637" height="827" fill="none" stroke="#10131a" stroke-width="3"/>
</svg>
