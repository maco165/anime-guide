<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="fullmetal-alchemist-card-title fullmetal-alchemist-card-desc" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
